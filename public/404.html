<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#000000" />
    <title>Página não encontrada — KYDSON</title>
    <link rel="icon" href="/brand/logo.png" />
    <style>
      :root{--ink:#000;--bone:#f8f0e3;--mute:#9d968a;--gold:#b8935a}
      *{box-sizing:border-box}
      html,body{margin:0;min-height:100%}
      body{background:var(--ink);color:var(--bone);font-family:"Euro Sans Pro","Eurostile",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem 1.25rem}
      img{width:150px;height:auto;margin-bottom:2rem}
      .code{font-size:clamp(6rem,26vw,13rem);line-height:1;margin:0;font-weight:700;letter-spacing:.04em;color:transparent;-webkit-text-stroke:1px var(--gold);opacity:.6}
      .kicker{margin:.5rem 0 0;font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
      h1{font-size:clamp(1.6rem,4.5vw,2.6rem);margin:.5rem 0 .8rem}
      p.t{max-width:36ch;margin:0 0 2rem;color:var(--mute);line-height:1.5}
      .row{display:flex;gap:.75rem;flex-wrap:wrap;justify-content:center}
      a.b{display:inline-block;padding:.9rem 1.5rem;border:1px solid var(--gold);color:var(--bone);text-decoration:none;font-weight:600;letter-spacing:.04em}
      a.b--on{background:var(--gold);color:#000}
      a.b:hover{filter:brightness(1.12)}
      a.b:focus-visible{outline:2px solid var(--bone);outline-offset:3px}
    </style>
  </head>
  <body>
    <img src="/brand/logo.png" alt="KYDSON" />
    <p class="code" aria-hidden="true">404</p>
    <p class="kicker">Página não encontrada</p>
    <h1>Esse endereço não existe.</h1>
    <p class="t">O link pode estar errado ou o produto saiu do catálogo. Veja o que temos na loja.</p>
    <div class="row">
      <a class="b b--on" href="/">Voltar ao início</a>
      <a class="b" href="/catalogo">Ver catálogo</a>
    </div>
  </body>
</html>
